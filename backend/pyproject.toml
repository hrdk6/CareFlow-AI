[project]
name = "careflow-backend"
version = "1.0.0"
description = "CareFlow AI - hospital platform API with ML, RAG and LLM orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "joblib>=1.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "fastembed>=0.4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "prometheus-client>=0.20",
    "pydicom>=3.0.2",
    "onnx>=1.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pgserver>=0.1.4",
    "fpdf2>=2.8",
    "fhir-resources>=8.3",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "models: tests that need downloaded embedding/reranker models",
    "llm: tests that need a live LLM provider",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP046"]  # line length is a formatter concern; Page[T] keeps Generic for Pydantic
